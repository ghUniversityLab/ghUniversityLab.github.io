<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="手持弹幕">
  <defs>
    <linearGradient id="lbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF0071" />
      <stop offset="1" stop-color="#B3004E" />
    </linearGradient>
    <filter id="lbGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 应用图标底 -->
  <rect width="48" height="48" rx="11" fill="url(#lbGrad)" />

  <!-- 横屏手机屏幕 -->
  <rect x="6" y="16.5" width="36" height="15" rx="5" fill="#0B0B0B" />
  <rect x="6" y="16.5" width="36" height="15" rx="5" fill="none" stroke="rgba(255,255,255,.24)" />

  <!-- 滚动的点阵文字：上排为高亮像素，下排为余晖 -->
  <g fill="#FFFFFF" filter="url(#lbGlow)">
    <rect x="10.5" y="20.6" width="2.4" height="2.4" rx="0.7" />
    <rect x="14.4" y="20.6" width="2.4" height="2.4" rx="0.7" />
    <rect x="18.3" y="20.6" width="2.4" height="2.4" rx="0.7" />
    <rect x="22.2" y="20.6" width="2.4" height="2.4" rx="0.7" />
    <rect x="26.1" y="20.6" width="2.4" height="2.4" rx="0.7" />
    <rect x="30" y="20.6" width="2.4" height="2.4" rx="0.7" />
    <rect x="33.9" y="20.6" width="2.4" height="2.4" rx="0.7" />
  </g>
  <g fill="#FFFFFF" opacity=".5">
    <rect x="12.45" y="25.4" width="2.4" height="2.4" rx="0.7" />
    <rect x="16.35" y="25.4" width="2.4" height="2.4" rx="0.7" />
    <rect x="20.25" y="25.4" width="2.4" height="2.4" rx="0.7" />
    <rect x="24.15" y="25.4" width="2.4" height="2.4" rx="0.7" />
    <rect x="28.05" y="25.4" width="2.4" height="2.4" rx="0.7" />
  </g>
</svg>
